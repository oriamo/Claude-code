name: Deploy Hot Takes site

on:
  push:
    branches:
      - main
      - claude/hot-takes-presentation-site-dx2wkf
    paths:
      - 'hot-takes/**'
      - '.github/workflows/deploy-hot-takes.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: hot-takes

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
